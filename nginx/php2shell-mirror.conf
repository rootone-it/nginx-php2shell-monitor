#
# nginx-php2shell-monitor: internal mirror location
#
# Copy this file to /etc/nginx/snippets/php2shell-mirror.conf and include it
# in the server block of each site to monitor:
#
#     include /etc/nginx/snippets/php2shell-mirror.conf;
#
# Add the following lines to each location block that passes requests to PHP:
#
#     mirror /__php2shell_monitor;
#     mirror_request_body on;
#
# nginx then sends a copy of each request, including the complete body and all
# original headers, as a subrequest to the location below. The response to the
# copy is discarded. The original request is passed to PHP unchanged.
#
# If the monitor is not running, only the copy fails and an error is written
# to the error log below. The website is not affected.
#

location = /__php2shell_monitor {
    internal;

    # Subrequests are not written to the access log. Errors of the copy (for
    # example if the monitor is not running) are written to a separate log.
    access_log off;
    error_log /var/log/nginx/php2shell-mirror-error.log error;

    # The vulnerabilities affect the POST parsing of PHP. Only POST requests are
    # forwarded. In the subrequest, $request_method contains the method of the
    # original request.
    if ($request_method != POST) {
        return 204;
    }

    # $request_uri contains the URI of the original request, including the
    # query string.
    proxy_pass http://127.0.0.1:9777$request_uri;

    # proxy_set_header replaces client headers with the same name. The client
    # IP recorded by the monitor can therefore not be spoofed.
    proxy_set_header Host                     $host;
    proxy_set_header X-Php2shell-Client-Ip    $remote_addr;
    proxy_set_header X-Php2shell-Request-Id   $request_id;

    # nginx always sends the copy with a Content-Length header. The original
    # Transfer-Encoding is passed separately, because chunked multipart
    # requests are used to bypass post_max_size.
    proxy_set_header X-Php2shell-Transfer-Encoding $http_transfer_encoding;

    # The monitor runs locally and responds immediately with 204. The short
    # timeouts prevent a blocked monitor from delaying keep-alive connections
    # of visitors.
    proxy_connect_timeout 1s;
    proxy_send_timeout    10s;
    proxy_read_timeout    5s;
}
