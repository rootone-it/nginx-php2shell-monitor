#
# Example configuration of a PHP site (front controller and php-fpm) with
# nginx-php2shell-monitor. Only the lines marked with "nginx-php2shell-monitor"
# are required for the monitor.
#

server {
    listen 443 ssl;
    server_name example.com;

    root /var/www/example.com/public;
    index index.php;

    # Larger requests are rejected with status 413 before they are mirrored and
    # appear only in the access log. The known exploit has about 3.5 MB.
    client_max_body_size 8M;

    # nginx-php2shell-monitor: internal mirror location
    include /etc/nginx/snippets/php2shell-mirror.conf;

    location / {
        # No mirror directive here: try_files redirects the request internally
        # to /index.php, which is handled by the PHP location below. A mirror
        # directive in both location blocks would mirror each request twice.
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        # nginx-php2shell-monitor: send a copy of each request, including the
        # body, to the monitor. Add these lines only to location blocks that
        # contain fastcgi_pass (named locations such as @php are supported).
        mirror /__php2shell_monitor;
        mirror_request_body on;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
