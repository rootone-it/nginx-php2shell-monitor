#!/usr/sbin/nft -f
#
# nginx-php2shell-monitor: nftables table for the example hook scripts
#
# The hook scripts add IP addresses to the sets below. Each entry expires
# after the timeout set by the script. Packets from these addresses are
# dropped before they reach nginx.
#
# Load:  sudo nft -f /opt/nginx-php2shell-monitor/hooks/php2shell-nftables.conf
#
# To load the table at boot, include this file in /etc/nftables.conf:
#     include "/opt/nginx-php2shell-monitor/hooks/php2shell-nftables.conf"
#
# The table is separate from other firewall rules (for example ufw or
# firewalld). Its chain has a lower priority value and therefore runs first.
#

# Recreate the table, so that the file can be loaded again after a change.
table inet php2shell
delete table inet php2shell

table inet php2shell {
    set blocked4 {
        type ipv4_addr
        flags timeout
    }

    set blocked6 {
        type ipv6_addr
        flags timeout
    }

    chain input {
        type filter hook input priority -10; policy accept;
        ip saddr @blocked4 drop
        ip6 saddr @blocked6 drop
    }
}
