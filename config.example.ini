#
# nginx-php2shell-monitor configuration
#
# Copy this file to config.ini and make your changes there. config.ini is
# ignored by git, so pulling updates won't overwrite it:
#     cp config.example.ini config.ini
#
# Start: python3 monitor.py -c config.ini
#

[server]
# Has to match the proxy_pass target in nginx/php2shell-mirror.conf.
listen_host = 127.0.0.1
listen_port = 9777

# Bodies are read up to this size; anything beyond is discarded and the capture
# is marked as truncated. nginx won't pass on more than client_max_body_size anyway.
max_body_bytes = 16777216

# How many requests can wait to be checked. When the queue is full, new copies
# are dropped and counted in the STATUS line.
queue_size = 200

[capture]
# Where suspicious requests are saved, one .req and one .json file each.
# The directory is created with mode 0700 and the files with 0600, because
# they contain cookies.
dir = /var/lib/nginx-php2shell-monitor/captures

# Size limit for the capture directory. Once it's reached, only the .json
# metadata is written, without the body. Nothing is ever deleted automatically.
max_total_mb = 2048

[log]
# Leave empty to log to the console only.
file = /var/log/nginx-php2shell-monitor/monitor.log

# Seconds between STATUS lines (0 turns them off).
stats_interval = 900

[rules]
# Field names longer than this (in bytes) are flagged. The known attack uses ~3.5 MB.
max_field_name_length = 1024

# Requests with more fields than this are flagged (PHP's default max_input_vars is 1000).
max_fields = 1000

# Bodies of this size or larger are flagged, except on the paths below.
large_body_bytes = 1048576

# Comma-separated path prefixes where large bodies are normal, such as upload
# routes or an admin area. Example: /admin, /api/upload
large_body_ignore_paths =

# Name of the upload progress field (PHP's default for session.upload_progress.name).
upload_progress_marker = PHP_SESSION_UPLOAD_PROGRESS

[mail]
# Leave empty to disable email alerts. Mail is sent through /usr/sbin/sendmail.
to =
from = nginx-php2shell-monitor@localhost

# Send at most one email per IP within this many seconds.
min_interval = 900
