#
# Example: a typical PHP site (front controller + php-fpm) with the monitor
# switched on. Only the lines marked "nginx-php2shell-monitor" are needed -
# everything else is just there for context.
#

server {
    listen 443 ssl;
    server_name example.com;

    root /var/www/example.com/public;
    index index.php;

    # Anything larger is rejected with a 413 before it gets mirrored, so it
    # only shows up in the access log. The known attack is around 3.5 MB.
    client_max_body_size 8M;

    # nginx-php2shell-monitor: internal mirror location
    include /etc/nginx/snippets/php2shell-mirror.conf;

    location / {
        # No mirror here: try_files passes the request on to /index.php
        # internally, where the PHP location below picks it up. Mirroring in
        # both places would copy every request twice.
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        # nginx-php2shell-monitor: send a copy of each request, body included,
        # to the monitor. Only add this where fastcgi_pass is actually called
        # (named locations like @php work too).
        mirror /__php2shell_monitor;
        mirror_request_body on;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
