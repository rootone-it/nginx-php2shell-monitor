#
# nginx-php2shell-monitor configuration
#
# Copy this file to config.ini and edit config.ini. config.ini is not tracked
# by git and is not overwritten by updates:
#     cp config.example.ini config.ini
#
# Start: python3 monitor.py -c config.ini
#

[server]
# Must match the proxy_pass address in nginx/php2shell-mirror.conf.
listen_host = 127.0.0.1
listen_port = 9777

# Maximum number of body bytes that are read. Larger bodies are cut off and
# marked as truncated. nginx does not pass more than client_max_body_size.
max_body_bytes = 16777216

# Maximum number of requests waiting for inspection. If the queue is full,
# further requests are dropped and counted in the STATUS line.
queue_size = 200

[capture]
# Directory for suspicious requests (one .req and one .json file per request).
# The directory is created with permissions 0700, the files with 0600, because
# they contain cookies.
dir = /var/lib/nginx-php2shell-monitor/captures

# Maximum size of the capture directory. When it is reached, only the .json
# files are written. Files are never deleted automatically.
max_total_mb = 2048

[log]
# Log file. Leave empty to log to the console only.
file = /var/log/nginx-php2shell-monitor/monitor.log

# Event log with one JSON object per line for each suspicious request,
# including repeated requests. It can easily be processed by other scripts.
# Leave empty to disable it.
events_file = /var/log/nginx-php2shell-monitor/events.log

# Interval of the STATUS line in seconds (0 = disabled).
stats_interval = 900

[rules]
# Only settings that depend on the monitored sites are configured here. The
# signatures and thresholds derived from the published exploits are part of the
# rules and defined in monitor.py, so that updates take effect without changes
# to config.ini.

# Maximum number of fields. The confirmed exploit chain sends 973 to 998
# parts, just below the PHP default for max_input_vars (1000). Raise the value
# if regular forms of your sites send more fields.
max_fields = 500

# Bodies of this size or larger are reported, except on the paths below.
large_body_bytes = 1048576

# Comma-separated path prefixes on which large bodies are expected, for
# example upload paths or an admin area. Example: /admin, /api/upload
large_body_ignore_paths =

# Name of the upload progress field (PHP default for session.upload_progress.name).
# A multipart field with exactly this name has the rule level php2shell. Other
# occurrences in the body are reported with the rule level generic.
upload_progress_marker = PHP_SESSION_UPLOAD_PROGRESS

# Name of the PHP session cookie (PHP default for session.name). A multipart
# field with exactly this name is reported. Use the value of session.name in
# php.ini or the php-fpm pool. A name that the application sets at run time
# (for example with session_name()) is not set yet when PHP parses the
# request body, so the upload progress handler still uses the ini value.
session_name = PHPSESSID

# Comma-separated rule names that are not reported, for example after false
# positives on your sites. The names are listed in the README. A warning is
# logged at startup. Example: suspicious_filename, large_body
disabled_rules =

# Comma-separated additional strings of exploit tools, searched in the body and
# the Content-Type header (case-insensitive) like the built-in markers. Matches
# are reported as exploit_tool_marker with the rule level php2shell.
extra_tool_markers =

[mail]
# Recipient address. Leave empty to disable email notifications.
# Emails are sent with /usr/sbin/sendmail.
to =
from = nginx-php2shell-monitor@localhost

# Minimum request level that sends an email: generic, php2shell or
# php2shell-chain. Requests with a lower level are only logged and stored.
# generic also sends emails for large uploads and other requests of regular
# visitors.
min_level = php2shell

# Minimum interval in seconds between two emails for the same IP.
min_interval = 900

[hook]
# Command that is run for each suspicious request, for example to block the IP
# address in the firewall (see hooks/). Leave empty to disable the hook.
#
# The command is split like a shell command line but started without a shell,
# so pipes, redirections and variables do not work. The event is passed on
# stdin as one JSON object, the same as in the event log. Request data is never
# inserted into the command line.
#
# Example (blocks the IP address with nftables or CrowdSec, see README):
#     command = sudo -n /usr/local/sbin/php2shell-ban
command =

# Minimum request level that runs the command: generic, php2shell or
# php2shell-chain.
min_level = php2shell

# Maximum run time of the command in seconds.
timeout = 30

# Minimum interval in seconds between two commands for the same IP.
min_interval = 300

# Maximum number of events waiting for the command. If the queue is full,
# further events are dropped and a warning is logged.
queue_size = 100
