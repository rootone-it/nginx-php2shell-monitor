#
# nginx-php2shell-monitor: internal mirror location
#
# Copy to /etc/nginx/snippets/php2shell-mirror.conf and include it inside the
# server block of every site you want to monitor:
#
#     include /etc/nginx/snippets/php2shell-mirror.conf;
#
# The location(s) that pass requests to PHP then get
#
#     mirror /__php2shell_monitor;
#     mirror_request_body on;
#
# nginx sends a copy of every request (including the full body and all original
# headers) as a subrequest to this location. The response of the copy is
# discarded, the actual request goes to PHP unchanged.
#
# If the monitor is not running, only the copy fails (entry in the error log
# below), the site itself is not affected.
#

location = /__php2shell_monitor {
    internal;

    # Subrequests are not access-logged anyway. Errors of the copy (monitor down)
    # go to a separate log instead of the site's error log.
    access_log off;
    error_log /var/log/nginx/php2shell-mirror-error.log error;

    # The vulnerability lives in PHP's POST parsing, only POST is relevant.
    # In the subrequest, $request_method is the method of the original request.
    if ($request_method != POST) {
        return 204;
    }

    # $request_uri is the URI of the original request (including the query string).
    proxy_pass http://127.0.0.1:9777$request_uri;

    # proxy_set_header replaces client headers of the same name, so a client
    # cannot spoof the IP the monitor records.
    proxy_set_header Host                     $host;
    proxy_set_header X-Php2shell-Client-Ip    $remote_addr;
    proxy_set_header X-Php2shell-Request-Id   $request_id;

    # The monitor runs locally and answers immediately with 204 - short timeouts
    # so a hanging monitor does not hold up visitors' keep-alive connections.
    proxy_connect_timeout 1s;
    proxy_send_timeout    10s;
    proxy_read_timeout    5s;
}
