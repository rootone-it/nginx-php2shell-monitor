#
# Example: a typical PHP site (front controller + php-fpm) with the monitor enabled.
# Only the lines marked "nginx-php2shell-monitor" are needed, the rest is context.
#

server {
    listen 443 ssl;
    server_name example.com;

    root /var/www/example.com/public;
    index index.php;

    # Bodies larger than this are rejected with 413 before mirroring - such
    # requests only show up in the access log. The known attack is ~3.5 MB.
    client_max_body_size 8M;

    # nginx-php2shell-monitor: internal mirror location
    include /etc/nginx/snippets/php2shell-mirror.conf;

    location / {
        # No mirror here: try_files redirects internally to /index.php, which
        # lands in the PHP location below. A mirror in both locations would
        # mirror every request twice.
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        # nginx-php2shell-monitor: copy of every request incl. body to the monitor.
        # Put it only in the location(s) that actually call fastcgi_pass
        # (this also works in named locations like @php).
        mirror /__php2shell_monitor;
        mirror_request_body on;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
