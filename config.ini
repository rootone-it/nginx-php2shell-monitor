#
# nginx-php2shell-monitor configuration
#
# Start: python3 monitor.py -c config.ini
#

[server]
# Must match proxy_pass in nginx/php2shell-mirror.conf.
listen_host = 127.0.0.1
listen_port = 9777

# Larger bodies are only read up to this size (and flagged as truncated).
# nginx only passes bodies up to client_max_body_size anyway.
max_body_bytes = 16777216

# Number of requests that may wait for analysis. If the queue is full, copies
# are dropped and counted in the STATUS line.
queue_size = 200

[capture]
# Suspicious requests are stored here completely as individual files (.req + .json).
# The directory is created with mode 0700, files with 0600 (they contain cookies).
dir = /var/lib/nginx-php2shell-monitor/captures

# Upper limit for the capture directory. Once reached, only the .json metadata
# is written, no bodies. Nothing is ever deleted.
max_total_mb = 2048

[log]
# Leave empty for console output only.
file = /var/log/nginx-php2shell-monitor/monitor.log

# Seconds between two STATUS lines (0 = off).
stats_interval = 900

[rules]
# Longest unsuspicious field name in bytes. Known attack: ~3.5 MB.
max_field_name_length = 1024

# More fields than this are suspicious (PHP default max_input_vars = 1000).
max_fields = 1000

# Bodies of this size and above are suspicious, except on the paths below.
large_body_bytes = 1048576

# Comma separated path prefixes where large bodies are expected, e.g. upload
# routes of your application or admin area. Example: /admin, /api/upload
large_body_ignore_paths =

# Name of the upload progress field (PHP default of session.upload_progress.name).
upload_progress_marker = PHP_SESSION_UPLOAD_PROGRESS

[mail]
# Leave empty for no mails. Sent via /usr/sbin/sendmail.
to =
from = nginx-php2shell-monitor@localhost

# At most one mail per IP within this period (seconds).
min_interval = 900
