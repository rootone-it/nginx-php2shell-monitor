#
# nginx-php2shell-monitor: internal mirror location
#
# Copy this file to /etc/nginx/snippets/php2shell-mirror.conf and include it
# in the server block of every site you want to watch:
#
#     include /etc/nginx/snippets/php2shell-mirror.conf;
#
# Then add these two lines to each location that hands requests to PHP:
#
#     mirror /__php2shell_monitor;
#     mirror_request_body on;
#
# For every request, nginx now sends a copy - full body and original headers
# included - to the location below as a subrequest. The reply to that copy is
# thrown away; the real request goes to PHP exactly as before.
#
# If the monitor isn't running, only the copy fails (you'll see it in the error
# log below). Your site carries on as normal.
#

location = /__php2shell_monitor {
    internal;

    # Subrequests aren't access-logged anyway. If the copy can't be delivered
    # (monitor down), the error goes to its own log rather than the site's.
    access_log off;
    error_log /var/log/nginx/php2shell-mirror-error.log error;

    # The flaws are in PHP's POST parsing, so only POST requests matter.
    # Inside the subrequest, $request_method is the original request's method.
    if ($request_method != POST) {
        return 204;
    }

    # $request_uri is the original request's URI, query string included.
    proxy_pass http://127.0.0.1:9777$request_uri;

    # proxy_set_header overrides any client header with the same name, so
    # clients can't fake the IP that ends up in the captures.
    proxy_set_header Host                     $host;
    proxy_set_header X-Php2shell-Client-Ip    $remote_addr;
    proxy_set_header X-Php2shell-Request-Id   $request_id;

    # The monitor runs locally and replies with 204 straight away. Short
    # timeouts make sure a stuck monitor can't hold up visitors' keep-alive
    # connections.
    proxy_connect_timeout 1s;
    proxy_send_timeout    10s;
    proxy_read_timeout    5s;
}
